name: CI

# ── CUÁNDO se ejecuta ─────────────────────────────────────────
on:
  push:
    branches: [main] # cada push a main
  pull_request:
    branches: [main] # cada PR que apunte a main

jobs:
  # ── JOB 1: BACKEND ──────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest # máquina Linux limpia, creada para esta ejecución

    defaults:
      run:
        working-directory: backend # todos los "run" se ejecutan dentro de backend/

    # Base de datos solo para los tests. Configurada IGUAL que db-test
    # de tu docker-compose, para que .env.test funcione sin cambios
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mes
          POSTGRES_PASSWORD: mes
          POSTGRES_DB: mes_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # ── JOB 2: FRONTEND (se ejecuta a la vez que el backend) ────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # ── JOB 3: IMÁGENES DOCKER ──────────────────────────────────
  # Solo empieza si Backend y Frontend han pasado.
  # En una PR solo construye (comprueba que los Dockerfiles funcionan).
  # En un push a main (es decir, tras un merge) además las publica en GHCR.
  docker:
    name: Docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # permiso para publicar en GitHub Container Registry

    # El mismo job se ejecuta dos veces: una con app=backend y otra con app=frontend
    strategy:
      matrix:
        app: [backend, frontend]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir (y publicar si es main)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/andriu323/mes-practica-${{ matrix.app }}:latest
            ghcr.io/andriu323/mes-practica-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
