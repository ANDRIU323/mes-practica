services:
  db:
    image: postgres:16
    container_name: mes-practica-db
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes
      POSTGRES_DB: mes_practica
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes_practica"]
      interval: 5s
      timeout: 5s
      retries: 10

  # BD solo para los tests del backend: perfil "test" (no arranca con un "up" normal),
  # puerto 5433 y datos en memoria (tmpfs), se pierden al pararla
  db-test:
    image: postgres:16
    container_name: mes-practica-db-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes
      POSTGRES_DB: mes_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: mes-practica-backend
    environment:
      # Dentro de la red de Docker, la BD se alcanza por el nombre del servicio
      DATABASE_URL: postgresql://mes:mes@db:5432/mes_practica
      PORT: 3001
      # Frontend de Docker y frontend de desarrollo (Vite)
      CORS_ORIGIN: http://localhost:8082,http://localhost:5173
      # Definir JWT_SECRET en el entorno o en un .env de la raíz; el valor por defecto es solo para desarrollo
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-cambiar}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001/api
    container_name: mes-practica-frontend
    ports:
      # 8080 y 8081 los usan otros proyectos (WordPress)
      - "8082:80"
    depends_on:
      - backend

volumes:
  pgdata:
